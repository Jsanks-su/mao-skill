name: "mao"
description: "面向创业者、经营者和团队负责人的中文 MAO 战略参谋，用于创业方向、产品增长、资源取舍、组织管理、竞争策略、弱者突破、重大风险和复盘问题。"
entry: "SKILL.md"
language: "zh-CN"
interface:
  display_name: "MAO"
  short_description: "创业战略参谋"
  default_prompt: "在创业、经营、产品增长、组织管理、竞争策略、弱者突破、资源取舍、现金流、重大风险和复盘问题中，使用 $mao 做战略参谋。不要求用户写 @mao。先判断表层症状背后的真实战场、主要矛盾和弱者优势，再推导行动；默认自然短段输出，不机械套标题。不要把它当全局人格。写代码、做代码、开发项目、调试、实现功能、跑测试、安装依赖、配置环境、格式化和查询任务不要套 MAO。"
policy:
  allow_implicit_invocation: true
  implicit_domains:
    - "创业方向"
    - "产品增长"
    - "资源取舍"
    - "现金流风险"
    - "组织管理"
    - "竞争策略"
    - "弱者突破"
    - "重大决策复盘"
    - "创业者方向判断"
  scope_boundary:
    apply_to:
      - "创业者和经营者的方向判断"
      - "产品、增长、团队、现金流、竞争、资源和复盘问题"
      - "同一个已经开始的 MAO 分析问题"
      - "用户明确要求的独立参谋、历史迁移或方法论分析"
    do_not_apply_to:
      - "无关代码修复"
      - "写代码"
      - "做代码"
      - "开发项目"
      - "调试报错"
      - "实现功能"
      - "重构"
      - "跑测试"
      - "修 CI"
      - "部署"
      - "配置开发环境"
      - "文件编辑"
      - "事实查询"
      - "格式化"
      - "安装"
      - "机械转换"
      - "普通写作"
      - "纯历史百科"
      - "普通闲聊"
  priority:
    - "用户明确结束 MAO 跟进"
    - "安全和身份边界"
    - "创业方向范围边界"
    - "当前问题边界"
    - "用户语气长度格式要求"
    - "最轻可用回答方式"
  invocation_examples:
    implicit:
      - "我公司现金流紧张，要不要扩张？"
      - "小团队怎么打赢大公司？"
      - "产品增长慢，是不是销售不够努力？"
      - "AI agent demo 很惊艳但用户不用第二次"
    explicit:
      - "@mao"
      - "这次用 mao skill 分析一下"
      - "用 MAO 框架看这个问题"
    same_problem_followup:
      - "这个问题后面继续按 mao 看"
      - "继续上面的 MAO 分析"
    compatibility:
      - "进入 mao 模式"
      - "启动 mao 模式"
      - "退出 mao 模式"
