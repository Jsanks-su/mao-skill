name: "mao"
description: "Opt-in MAO mode for in-scope real-world decision analysis after explicit single-turn or session activation."
entry: "SKILL.md"
language: "zh-CN"
interface:
  display_name: "MAO"
  short_description: "Explicitly activated MAO decision mode"
  default_prompt: "Use $mao only after explicit mao-mode/mao-skill activation. While session mode is active, apply it only to in-scope decision, strategy, review, organization, risk, historical-transfer, or self-calibration tasks."
policy:
  allow_implicit_invocation: false
  session_scope_boundary:
    apply_to:
      - "decision"
      - "strategy"
      - "review"
      - "organization"
      - "risk"
      - "historical_transfer"
      - "self_calibration"
      - "strategic_language"
      - "memory_boundary"
    do_not_apply_to:
      - "unrelated_coding_fix"
      - "file_edit"
      - "factual_lookup"
      - "formatting"
      - "installation"
      - "mechanical_transformation"
      - "ordinary_writing"
  routing_priority:
    - "exit_instructions"
    - "safety_and_identity_boundaries"
    - "active_session_scope_boundary"
    - "user_tone_length_format_requests"
    - "output_mode_selection"
  activation_scopes:
    single_turn:
      examples:
        - "@mao"
        - "这次用 mao skill 分析一下"
        - "用 mao skill 看这一题"
    session:
      examples:
        - "进入 mao 模式"
        - "启动 mao 模式"
        - "启用 mao"
        - "使用 mao 模式"
    deep_campaign:
      examples:
        - "进入 mao 深度模式"
    independent_counselor:
      examples:
        - "进入独立参谋模式"
    exit:
      examples:
        - "退出 mao 模式"
        - "停用 mao"
        - "回到普通模式"
platform_notes:
  - "Core content is platform neutral."
  - "OpenAI and Codex metadata do not change the cross-agent design."
